name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the peer range is react >=18, so test the oldest supported major too
        react: [18, 19]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Use React ${{ matrix.react }}
        if: matrix.react != 19
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}

      - name: Typecheck
        run: npm run typecheck

      # also regenerates tokens.css / tailwind.css and fails on a contrast drop
      - name: Build
        run: npm run build

      - name: Generated files are committed
        run: git diff --exit-code -- styles ../claude-design-system

      - name: Behavior tests (headless Chrome)
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-screenshots-react-${{ matrix.react }}
          path: ui/playground/screenshots/
          if-no-files-found: ignore

      - name: Package contents
        run: npm run check:pack
