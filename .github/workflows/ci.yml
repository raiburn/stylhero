name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # also regenerates tokens.css / tailwind.css and fails on a contrast drop
      - name: Build
        run: npm run build

      - name: Generated files are committed
        run: git diff --exit-code -- styles ../claude-design-system

      - name: Behavior tests (headless Chrome)
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-screenshots
          path: ui/playground/screenshots/
          if-no-files-found: ignore

      - name: Package contents
        run: npm run check:pack
