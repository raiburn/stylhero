<!-- @dsCard height=288 -->
<div style="position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface)">
  <style>
    .cv-primary { fill: var(--primary); }
    .cv-accent { fill: var(--accent); }
    .cv-sky { fill: var(--sky); }
    .cv-ink { fill: var(--ink); }
    .cv-ground { fill: var(--surface); }
    .cv-r-lg { rx: var(--radius-lg); }
    .cv-pill { rx: 8px; }
    .cv-name { position: absolute; left: 40px; bottom: 40px; max-width: 440px; display: flex; flex-direction: column; gap: 8px; }
    .cv-name h1 { margin: 0; font: 800 88px/0.92 var(--font-display); letter-spacing: -0.03em; color: var(--ink); }
    .cv-name p { margin: 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
  </style>
  <svg width="960" height="288" viewBox="0 0 960 288" style="position:absolute;inset:0" aria-hidden="true">
    <!--
      blocks: primary navy slab 192x288 (6 x space-8 by full height); lemon accent disc d=128 (radius-full, the logo's dot);
              ink 224x112 bleeding right and bottom; sky 96x128 (radius-lg) bleeding right.
      arrangement: one tall slab with satellites, gaps of space-4, everything right of x=480.
      pattern: "a literal motif (wave)": the Ocean palette, so the slab's edges are scalloped by ground-colored half-discs
               and the ink block carries two rows of ground-cut pills like ripples.
      scales: discs r = space-6, scallop pitch = space-12; pills 48x16 with rx half the short side; gaps space-4; sky corner radius-lg.
    -->
    <rect class="cv-primary" x="528" y="0" width="192" height="288"/>
    <circle class="cv-accent" cx="800" cy="96" r="64"/>
    <rect class="cv-sky cv-r-lg" x="880" y="32" width="96" height="128"/>
    <rect class="cv-ink" x="736" y="176" width="224" height="112"/>
    <circle class="cv-ground" cx="552" cy="0" r="24"/>
    <circle class="cv-ground" cx="600" cy="0" r="24"/>
    <circle class="cv-ground" cx="648" cy="0" r="24"/>
    <circle class="cv-ground" cx="696" cy="0" r="24"/>
    <circle class="cv-ground" cx="552" cy="288" r="24"/>
    <circle class="cv-ground" cx="600" cy="288" r="24"/>
    <circle class="cv-ground" cx="648" cy="288" r="24"/>
    <circle class="cv-ground" cx="696" cy="288" r="24"/>
    <rect class="cv-ground cv-pill" x="760" y="200" width="48" height="16"/>
    <rect class="cv-ground cv-pill" x="824" y="200" width="48" height="16"/>
    <rect class="cv-ground cv-pill" x="888" y="200" width="48" height="16"/>
    <rect class="cv-ground cv-pill" x="792" y="240" width="48" height="16"/>
    <rect class="cv-ground cv-pill" x="856" y="240" width="48" height="16"/>
    <rect class="cv-ground cv-pill" x="920" y="240" width="48" height="16"/>
  </svg>
  <div class="cv-name">
    <h1>Stylhero</h1>
    <p>Clear, confident interfaces: deep navy for trust, sky blue for clarity, a flash of lemon for the moments worth celebrating.</p>
  </div>
</div>
