<!-- @dsCard group="Display" height=150 subtitle="Headline numbers for dashboards" -->
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:24px;background:var(--surface)">
  <div class="sh-card"><div class="sh-stat"><span class="sh-stat__label">Visits this week</span><span class="sh-stat__value">1,284</span><span class="sh-stat__meta"><span class="sh-stat__change sh-stat__change--good"><i data-lucide="trending-up"></i>+12%</span><span>vs last week</span></span></div></div>
  <div class="sh-card"><div class="sh-stat"><span class="sh-stat__label">Avg. wait</span><span class="sh-stat__value">3m 10s</span><span class="sh-stat__meta"><span class="sh-stat__change sh-stat__change--good"><i data-lucide="trending-down"></i>−8%</span><span>faster</span></span></div></div>
  <div class="sh-card"><div class="sh-stat"><span class="sh-stat__label">Rewards redeemed</span><span class="sh-stat__value">96</span><span class="sh-stat__meta"><span class="sh-stat__change sh-stat__change--bad"><i data-lucide="trending-down"></i>−4%</span></span></div></div>
</div>
