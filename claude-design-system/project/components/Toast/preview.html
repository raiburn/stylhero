<!-- @dsCard group="Feedback" height=200 subtitle="Brief confirmation, bottom-right" -->
<div style="display:flex;flex-direction:column;gap:16px;padding:24px;background:var(--surface);font-family:var(--font-sans);">
  <div class="sh-toast sh-toast--success" style="max-width:360px"><i data-lucide="circle-check"></i><div class="sh-toast__body">Stamp added. María has 8 of 10.</div><button class="sh-toast__close" aria-label="Dismiss"><i data-lucide="x"></i></button></div>
  <div class="sh-toast sh-toast--info" style="max-width:360px"><i data-lucide="info"></i><div class="sh-toast__body">Changes saved.</div><button class="sh-toast__close" aria-label="Dismiss"><i data-lucide="x"></i></button></div>
  <div class="sh-toast sh-toast--danger" style="max-width:360px"><i data-lucide="circle-alert"></i><div class="sh-toast__body">Couldn't reach the server. Try again.</div><button class="sh-toast__close" aria-label="Dismiss"><i data-lucide="x"></i></button></div>
</div>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>window.lucide && lucide.createIcons();</script>
