<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;padding:24px;background:var(--surface)">
  <div class="sh-field">
    <label class="sh-field__label" for="pv-reward">Reward</label>
    <div class="sh-select-wrap"><select class="sh-input" id="pv-reward"><option>Free coffee</option><option>Free pastry</option><option>10% off</option></select></div>
    <span class="sh-field__hint">Given at 10 stamps.</span>
  </div>
  <div class="sh-field sh-field--error">
    <label class="sh-field__label" for="pv-branch">Branch</label>
    <div class="sh-select-wrap"><select class="sh-input" id="pv-branch"><option>Choose a branch</option></select></div>
    <span class="sh-field__hint">Choose where the card was issued.</span>
  </div>
</div>
