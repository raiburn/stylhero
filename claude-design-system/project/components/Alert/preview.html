<!-- @dsCard group="Feedback" height=300 subtitle="Info, success, warning, danger" -->
<div style="display:flex;flex-direction:column;gap:16px;padding:24px;background:var(--surface);font-family:var(--font-sans);">
  <div class="sh-alert sh-alert--info" role="status"><i data-lucide="info"></i><div><strong class="sh-alert__title">New: double-stamp days</strong>Turn them on in Settings to bring customers back on slow days.</div></div>
  <div class="sh-alert sh-alert--success" role="status"><i data-lucide="circle-check"></i><div>Reward redeemed. María has 0 of 10 stamps again.</div></div>
  <div class="sh-alert sh-alert--warning" role="alert"><i data-lucide="triangle-alert"></i><div><strong class="sh-alert__title">Card expires in 3 days</strong>Remind the customer to use their stamps.</div></div>
  <div class="sh-alert sh-alert--danger" role="alert"><i data-lucide="circle-alert"></i><div>This card number is already registered to another customer.</div></div>
</div>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>window.lucide && lucide.createIcons();</script>
