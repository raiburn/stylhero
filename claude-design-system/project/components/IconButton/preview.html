<!-- @dsCard group="Actions" height=110 subtitle="Ghost, secondary, primary; two sizes" -->
<div style="display:flex;flex-direction:column;gap:16px;padding:24px;background:var(--surface);font-family:var(--font-sans);">
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <button class="sh-icon-btn" aria-label="Search"><i data-lucide="search"></i></button>
    <button class="sh-icon-btn sh-icon-btn--secondary" aria-label="More actions"><i data-lucide="ellipsis"></i></button>
    <button class="sh-icon-btn sh-icon-btn--primary" aria-label="Add customer"><i data-lucide="plus"></i></button>
    <button class="sh-icon-btn sh-icon-btn--sm" aria-label="Edit"><i data-lucide="pencil"></i></button>
    <button class="sh-icon-btn sh-icon-btn--sm sh-icon-btn--secondary" aria-label="Delete"><i data-lucide="trash-2"></i></button>
  </div>
</div>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>window.lucide && lucide.createIcons();</script>
